name: ci

# Lint, tests and generated-file checks on every push to main and every pull request.
# Actions are pinned to full commit SHAs and uv to an exact version; the job can only read.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.5"

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: uv sync --locked
      - run: uv run --locked ruff check src tests scripts clients
      - run: uv run --locked ruff format --check src tests scripts clients
      - run: uv run --locked pytest
      - run: python3 scripts/privacy_check.py --all
      - name: Committed plugins match clients/, and clients/ holds only tracked files
        run: python3 scripts/build_clients.py --check
      - name: Generated reference pages match the code
        run: uv run --locked python scripts/make_reference.py --check
      - name: Documentation links and anchors resolve
        run: uv run --locked python scripts/check_docs.py
      - name: Device client still runs on Python 3.9 with the standard library only
        run: |
          python3 scripts/build_clients.py
          uv run --no-project --python 3.9 python dist/client/jezero_client.py --version
          uv run --no-project --python 3.9 python dist/client/jezero_client.py protocol > /dev/null
