name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check src tests scripts clients
      - run: uv run ruff format --check src tests scripts clients
      - run: uv run pytest
      - run: python3 scripts/privacy_check.py --all
      - name: Committed plugins match clients/
        run: python3 scripts/build_clients.py --check
      - name: Generated reference pages match the code
        run: uv run python scripts/make_reference.py --check
      - name: Documentation links and anchors resolve
        run: uv run python scripts/check_docs.py
      - name: Device client still runs on Python 3.9 with the standard library only
        run: |
          python3 scripts/build_clients.py
          uv run --no-project --python 3.9 python dist/client/jezero_client.py --version
          uv run --no-project --python 3.9 python dist/client/jezero_client.py protocol > /dev/null
