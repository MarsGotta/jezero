[project]
name = "jezero"
dynamic = ["version", "readme"]
description = "A shared, searchable library of your agents' past work: connectors, summaries with atoms, SQLite FTS5 search, served over MCP."
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Marcela Gotta" }]
keywords = ["mcp", "agents", "memory", "knowledge-base", "sqlite", "fts5", "bm25"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "mcp>=2.0,<3",          # uses mcp.server.mcpserver (SDK 2.x); 1.x fails at import
    "pydantic>=2.12",       # what mcp 2.0 requires anyway
    "httpx>=0.27",
    "starlette>=0.27",      # imported directly by jezero.server (Route, responses)
    "uvicorn>=0.31.1",
    "zstandard>=0.22",
    "textual>=8.2",
    "rich>=14.2",           # textual 8.2 requires it
]

[project.urls]
Homepage = "https://jezero.marsgotta.com"
Documentation = "https://jezero.marsgotta.com"
Source = "https://github.com/MarsGotta/jezero"
Issues = "https://github.com/MarsGotta/jezero/issues"
Changelog = "https://github.com/MarsGotta/jezero/blob/main/CHANGELOG.md"

[project.scripts]
jezero = "jezero.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]
docs = [
    "zensical>=0.0.71",
]

[build-system]
requires = ["hatchling>=1.26", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/jezero/__init__.py"  # single source: `jezero --version` and the metadata agree

# PyPI renders the README without the repository around it: make relative links and
# images absolute at build time, so the README in the repo keeps its relative links.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'src="(?!https?://)([^"]+)"'
replacement = 'src="https://raw.githubusercontent.com/MarsGotta/jezero/main/\1"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|mailto:|#)([^)]+)\)'
replacement = '](https://github.com/MarsGotta/jezero/blob/main/\1)'

[tool.hatch.build.targets.sdist]
# What is needed to build the wheel and run the tests; not the website, CI or screenshots.
include = [
    "/src",
    "/tests",
    "/clients",
    "/scripts",
    "/plugins",
    "/examples",
    "/jezero.example.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
    "/LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jezero"]

[tool.hatch.build.targets.wheel.force-include]
"plugins/opencode" = "jezero/_plugins/opencode"  # for `jezero` app installs into OpenCode

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/jezero/client_core.py"]  # a copy of clients/core, linted there

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S104", "S105", "S106", "S108", "S603", "S607"]
"scripts/**" = ["S603", "S607"]  # fixed git invocations, no user input
"scripts/make_architecture.py" = ["E501"]  # diagram labels are long strings
"src/jezero/ui/data.py" = ["S603"]  # fixed install commands, shown to the user first

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
